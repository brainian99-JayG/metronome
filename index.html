<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>메트로놈</title>
<meta name="theme-color" content="#101418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="메트로놈">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<style>
:root{
  --bg:#101418;
  --panel:#181e24;
  --panel2:#1f272e;
  --line:#2b343d;
  --text:#e8eef3;
  --dim:#8a97a3;
  --accent:#00c2b2;
  --accent-strong:#2af5e2;
  --danger:#ff5a5a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",Roboto,"Noto Sans KR",sans-serif;
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}

.app{
  min-height:100vh;            /* 아주 오래된 브라우저용 최후 보루 */
  min-height:100dvh;           /* 주소창을 제외한 실제 높이 */
  min-height:var(--appH,100dvh); /* JS가 측정한 값이 있으면 그걸 우선 */
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 12px calc(env(safe-area-inset-bottom) + 8px);
  gap:clamp(6px,1.2dvh,10px);max-width:560px;margin:0 auto;
}

/* ── 상단 ─────────────────────────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding:0 4px}
.topbar h1{margin:0;font-size:15px;letter-spacing:.22em;font-weight:600;color:var(--dim)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:var(--dim);background:var(--panel)}
.icon-btn.on{color:var(--accent-strong);background:#12312f}

/* ── 비트 표시등 ───────────────────────── */
.beats{
  flex:1 1 auto;min-height:46px;max-height:34dvh;
  background:#000;border-radius:18px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  gap:min(3.5vw,20px);padding:clamp(8px,1.4dvh,14px);flex-wrap:wrap;
}
.dot{
  width:min(10vw,clamp(24px,5.2dvh,48px));height:min(10vw,clamp(24px,5.2dvh,48px));border-radius:50%;
  border:2px solid #0d4b46;background:#0a2f2c;
  transition:background .08s linear,transform .08s linear,box-shadow .08s linear;
  display:grid;place-items:center;font-size:0;
}
.dot.strong{border-color:#12726a}
.dot.on{background:var(--accent);transform:scale(1.12)}
.dot.on.strong{background:var(--accent-strong);box-shadow:0 0 22px rgba(42,245,226,.55)}

/* ── BPM ──────────────────────────────── */
.tempo{flex:0 0 auto;background:var(--panel);border-radius:18px;padding:clamp(6px,1.1dvh,10px) 12px clamp(8px,1.3dvh,12px)}
.bpm-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{
  width:clamp(58px,9.2dvh,68px);height:clamp(58px,9.2dvh,68px);border-radius:20px;background:var(--panel2);
  font-size:clamp(28px,4.4dvh,34px);font-weight:300;line-height:1;display:grid;place-items:center;
}
.step:active{background:#2c363f}
.bpm-box{text-align:center;flex:1 1 auto;min-width:0}
.bpm-num{font-size:min(15vw,clamp(40px,9.2dvh,72px));font-weight:300;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bpm-unit{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-top:2px}
.tempo-name{text-align:center;color:var(--dim);font-size:12px;font-style:italic;margin-top:1px;min-height:15px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:clamp(22px,3dvh,28px);background:transparent;margin-top:2px;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);
  margin-top:-11px;border:3px solid var(--panel);
}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:3px solid var(--panel);border-radius:50%;background:var(--accent)}

/* ── 선택 칩 ──────────────────────────── */
.rows{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(5px,1dvh,8px)}
.row{display:flex;align-items:center;gap:8px}
.row-label{width:44px;flex:0 0 auto;font-size:11px;color:var(--dim);letter-spacing:.05em}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-width:58px;height:clamp(41px,5.8dvh,48px);padding:0 13px;border-radius:12px;
  background:var(--panel);color:var(--dim);font-size:15px;font-weight:500;
  display:grid;place-items:center;border:1px solid transparent;
}
.chip.sel{background:#0f2f2d;color:var(--accent-strong);border-color:var(--accent)}

/* ── 하단 조작부 ──────────────────────── */
.transport{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:2px}
.side-btn{
  width:clamp(78px,23vw,96px);height:clamp(58px,8.6dvh,72px);border-radius:18px;background:var(--panel);
  font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--text);
  display:grid;place-items:center;
}
.side-btn:active{background:var(--panel2)}
.side-btn small{display:block;font-size:10px;color:var(--dim);letter-spacing:0;font-weight:400;margin-top:3px}
.play{
  width:clamp(80px,14dvh,104px);height:clamp(80px,14dvh,104px);border-radius:50%;
  background:var(--accent);color:#04211f;
  font-size:clamp(32px,5.4dvh,42px);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,194,178,.28);
}
.play.playing{background:var(--panel2);color:var(--accent-strong);box-shadow:none;border:2px solid var(--accent)}
.play:active{transform:scale(.96)}

/* ── 설정 패널 ────────────────────────── */
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:flex-end;justify-content:center;z-index:10;
}
.sheet.open{display:flex}
.sheet-inner{
  width:100%;max-width:560px;background:var(--panel);border-radius:20px 20px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);
}
.sheet h2{margin:0 0 14px;font-size:15px;color:var(--dim);font-weight:600;letter-spacing:.05em}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row span{flex:0 0 78px;font-size:14px}
.toggle{margin-left:auto;width:56px;height:32px;border-radius:16px;background:var(--panel2);position:relative;transition:background .15s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.toggle.on{background:#0f3b37}
.toggle.on::after{transform:translateX(24px);background:var(--accent-strong)}
.sheet-close{width:100%;height:50px;border-radius:14px;background:var(--panel2);margin-top:16px;font-size:15px;font-weight:600}
.hint{font-size:11px;color:var(--dim);line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="icon-btn" id="btnSettings" aria-label="설정">⚙</button>
    <h1>메트로놈</h1>
    <button class="icon-btn" id="btnLock" aria-label="화면 켜짐 유지">☀</button>
  </div>

  <div class="beats" id="beats"></div>

  <div class="tempo">
    <div class="bpm-row">
      <button class="step" id="btnMinus" aria-label="느리게">−</button>
      <div class="bpm-box">
        <div class="bpm-num" id="bpmNum">120</div>
        <div class="bpm-unit">BPM</div>
      </div>
      <button class="step" id="btnPlus" aria-label="빠르게">+</button>
    </div>
    <div class="tempo-name" id="tempoName"></div>
    <input type="range" id="bpmSlider" min="30" max="300" step="1" value="120" aria-label="템포">
  </div>

  <div class="rows">
    <div class="row">
      <div class="row-label">박자</div>
      <div class="chips" id="meterChips"></div>
    </div>
    <div class="row">
      <div class="row-label">분할음</div>
      <div class="chips" id="subChips"></div>
    </div>
  </div>

  <div class="transport">
    <button class="side-btn" id="btnTap">TAP<small>두드려 입력</small></button>
    <button class="play" id="btnPlay" aria-label="재생">▶</button>
    <button class="side-btn" id="btnReset">초기화<small>120 · 4/4</small></button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h2>설정</h2>
    <div class="set-row">
      <span>소리 크기</span>
      <input type="range" id="volSlider" min="0" max="100" step="1" value="80" aria-label="소리 크기">
    </div>
    <div class="set-row">
      <span>진동</span>
      <button class="toggle" id="tglVibe" aria-label="진동"></button>
    </div>
    <div class="set-row">
      <span>화면 유지</span>
      <button class="toggle" id="tglWake" aria-label="화면 켜짐 유지"></button>
    </div>
    <div class="set-row">
      <span>첫박 강조</span>
      <button class="toggle" id="tglAccent" aria-label="첫박 강조"></button>
    </div>
    <button class="sheet-close" id="btnCloseSheet">닫기</button>
    <div class="hint">
      • 진동은 안드로이드에서만 동작합니다(아이폰 미지원).<br>
      • 아이폰은 측면 무음 스위치가 켜져 있으면 소리가 나지 않습니다.<br>
      • 홈 화면에 추가해서 실행하면 전체화면으로 열리고, 인터넷 없이도 동작합니다.
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
